<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Greetwell architecture on AWS</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#526077"/></marker>
    <style>
      .box{fill:#fff;stroke:#cfd6e1;stroke-width:1.5}
      .aws{fill:#fff7ed;stroke:#f59e0b;stroke-width:1.5}
      .ai{fill:#eef0ff;stroke:#4f46e5;stroke-width:1.5}
      .t{font-size:17px;font-weight:700;fill:#0f172a}
      .s{font-size:13.5px;fill:#526077}
      .l{stroke:#526077;stroke-width:1.6;fill:none;marker-end:url(#a)}
      .lab{font-size:12.5px;fill:#526077}
    </style>
  </defs>
  <rect width="1200" height="640" fill="#fbfaf7"/>
  <text x="40" y="48" font-size="24" font-weight="800" fill="#0f172a">Greetwell on AWS</text>
  <text x="40" y="74" class="s">Serverless end to end: nothing runs when nobody is chatting. One CloudFormation template.</text>

  <rect class="box" x="40" y="130" width="200" height="86" rx="12"/>
  <text x="60" y="164" class="t">Visitor</text><text x="60" y="188" class="s">chat widget on any website</text>
  <rect class="box" x="40" y="250" width="200" height="86" rx="12"/>
  <text x="60" y="284" class="t">Business owner</text><text x="60" y="308" class="s">landing page + dashboard</text>

  <rect class="aws" x="320" y="150" width="210" height="166" rx="12"/>
  <text x="340" y="186" class="t">Amazon CloudFront</text>
  <text x="340" y="212" class="s">HTTPS, global edge</text>
  <text x="340" y="236" class="s">/  and  /widget.js → S3</text>
  <text x="340" y="258" class="s">/api/*  → API Gateway</text>
  <text x="340" y="280" class="s">adds secret origin header,</text>
  <text x="340" y="300" class="s">real viewer IP</text>

  <rect class="aws" x="610" y="110" width="200" height="72" rx="12"/>
  <text x="630" y="142" class="t">Amazon S3</text><text x="630" y="164" class="s">site + widget (private, OAC)</text>

  <rect class="aws" x="610" y="250" width="200" height="72" rx="12"/>
  <text x="630" y="282" class="t">API Gateway</text><text x="630" y="304" class="s">HTTP API, throttled</text>

  <rect class="aws" x="610" y="390" width="200" height="96" rx="12"/>
  <text x="630" y="422" class="t">Lambda: API</text>
  <text x="630" y="446" class="s">assistants, chat, leads,</text><text x="630" y="466" class="s">rate limits, scoring</text>

  <rect class="aws" x="890" y="390" width="270" height="96" rx="12"/>
  <text x="910" y="422" class="t">Lambda: site reader</text>
  <text x="910" y="446" class="s">async; reads up to 8 pages,</text><text x="910" y="466" class="s">SSRF-guarded, robots.txt aware</text>

  <rect class="aws" x="430" y="540" width="250" height="76" rx="12"/>
  <text x="450" y="572" class="t">Amazon DynamoDB</text><text x="450" y="594" class="s">assistants, chats (TTL), leads</text>

  <rect class="aws" x="720" y="540" width="200" height="76" rx="12"/>
  <text x="740" y="572" class="t">Amazon S3</text><text x="740" y="594" class="s">knowledge bases</text>

  <rect class="ai" x="890" y="230" width="232" height="110" rx="12"/>
  <text x="910" y="264" class="t">Amazon Bedrock</text>
  <text x="910" y="288" class="s">Claude: business profiles,</text>
  <text x="910" y="308" class="s">conversations, save_lead tool</text>
  <text x="910" y="328" class="s">prompt caching, model fallback</text>

  <rect class="box" x="960" y="110" width="200" height="72" rx="12"/>
  <text x="980" y="142" class="t">Business website</text><text x="980" y="164" class="s">public pages only</text>

  <path class="l" d="M240 173 L318 200"/>
  <path class="l" d="M240 293 L318 266"/>
  <path class="l" d="M530 200 L608 152"/>
  <path class="l" d="M530 266 L608 284"/>
  <path class="l" d="M710 322 L710 388"/>
  <path class="l" d="M810 438 L888 438"/><text x="818" y="430" class="lab">async</text>
  <path class="l" d="M790 390 L888 320"/>
  <path class="l" d="M1005 390 L1005 342"/>
  <path class="l" d="M1142 390 L1142 184"/>
  <path class="l" d="M660 486 L590 538"/>
  <path class="l" d="M760 486 L800 538"/>
  <path class="l" d="M960 486 L880 538"/>
</svg>
